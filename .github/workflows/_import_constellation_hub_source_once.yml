# SPDX-License-Identifier: Apache-2.0
name: Import exact Constellation Hub source once

on:
  push:
    branches:
      - fix/constellation-source-reconcile-20260906
    paths:
      - .github/workflows/_import_constellation_hub_source_once.yml

permissions:
  contents: write

concurrency:
  group: constellation-source-reconcile-20260906
  cancel-in-progress: false

jobs:
  import-source:
    if: github.repository == 'szl-holdings/szl-constellation' && github.ref == 'refs/heads/fix/constellation-source-reconcile-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact reconciliation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/constellation-source-reconcile-20260906
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Import and verify exact public Hub bytes
        env:
          EXPECTED_HUB_REVISION: 244c2ae32d3d1a515e46498f635f8ff1067c6418
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/constellation-source-reconcile-20260906
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"

          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import os
          import shutil
          import urllib.parse
          import urllib.request
          from pathlib import Path, PurePosixPath

          repo_id = "SZLHOLDINGS/szl-constellation"
          revision = os.environ["EXPECTED_HUB_REVISION"]
          api_url = f"https://huggingface.co/api/spaces/{repo_id}"
          with urllib.request.urlopen(api_url, timeout=45) as response:
              metadata = json.load(response)
          if metadata.get("sha") != revision:
              raise SystemExit(
                  "Hub source advanced before import: "
                  f"expected={revision} observed={metadata.get('sha')}"
              )
          runtime = metadata.get("runtime") or {}
          if runtime.get("sha") != revision:
              raise SystemExit(
                  "Hub runtime/source identity diverged: "
                  f"source={revision} runtime={runtime.get('sha')}"
              )
          if runtime.get("stage") != "RUNNING":
              raise SystemExit(f"Hub runtime is not RUNNING: {runtime.get('stage')!r}")
          hardware = runtime.get("hardware") or {}
          if hardware.get("current") != "cpu-basic" or hardware.get("requested") != "cpu-basic":
              raise SystemExit(f"CPU allocation drift: {hardware!r}")

          expected = {
              ".gitattributes": (1519, "a6344aac8c09253b3b630fb776ae94478aa0275b"),
              "README.md": (1431, "41044342e88754cff664bb04bc64435c3372122d"),
              "app.py": (57269, "cfa10175ff4f1c82892c7bae06a7dfb0341da93c"),
              "c2/index.html": (12210, "be4f2eedf3351536600fcf0c9d96a3d747b10ca5"),
              "crosscheck.py": (6464, "971ce2b5a9d30bcb469d0451428504c403527660"),
              "estates.json": (16710, "650afa2e570bb824a4a27a4793f852adbae50d58"),
              "holo/index.html": (34836, "5adb80c4e00c436cb73e0b546767d8d9a6ab63a6"),
              "requirements.txt": (44, "c1937a17eead4ff6f93d358a42d9c8456a2e58e6"),
              "test_runtime_contract.py": (2607, "088be48fc42f89de7317ab8fd2b8b788cadb2dba"),
              "tests/test_app.py": (12744, "01c1970f1676b24a848827e4836988592bdd7c27"),
              "verticals.json": (9166, "9b4cf52e5d511d40bf2fc785d6f899dce3a5fca3"),
          }

          tree_url = (
              f"https://huggingface.co/api/spaces/{repo_id}/tree/{revision}"
              "?recursive=true&expand=true"
          )
          with urllib.request.urlopen(tree_url, timeout=45) as response:
              tree = json.load(response)
          observed = {
              row["path"]: (int(row.get("size") or 0), row.get("oid"))
              for row in tree
              if row.get("type") == "file"
          }
          if observed != expected:
              raise SystemExit(
                  "Hub file inventory changed: "
                  f"expected={expected!r} observed={observed!r}"
              )

          root = Path("space")
          download_root = Path(".hub-source-import")
          if download_root.exists():
              shutil.rmtree(download_root)
          download_root.mkdir()

          receipt_files: list[dict[str, object]] = []
          for relative, (size, oid) in sorted(expected.items()):
              pure = PurePosixPath(relative)
              if pure.is_absolute() or ".." in pure.parts:
                  raise SystemExit(f"unsafe Hub path: {relative!r}")
              url = (
                  f"https://huggingface.co/spaces/{repo_id}/resolve/{revision}/"
                  + urllib.parse.quote(relative, safe="/")
              )
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "szl-constellation-source-reconciler/1"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read()
              if len(data) != size:
                  raise SystemExit(
                      f"size mismatch for {relative}: expected={size} observed={len(data)}"
                  )
              git_oid = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + b"\0" + data
              ).hexdigest()
              if git_oid != oid:
                  raise SystemExit(
                      f"Git object mismatch for {relative}: expected={oid} observed={git_oid}"
                  )
              target = download_root / pure
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              receipt_files.append(
                  {
                      "path": relative,
                      "bytes": len(data),
                      "gitBlobOid": git_oid,
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )

          managed = set(expected)
          for existing in sorted(root.rglob("*"), reverse=True):
              if existing.is_file():
                  relative = existing.relative_to(root).as_posix()
                  if relative in managed or relative == "holo/MIRROR.md":
                      existing.unlink()
          for directory in sorted(
              (path for path in root.rglob("*") if path.is_dir()), reverse=True
          ):
              try:
                  directory.rmdir()
              except OSError:
                  pass

          for relative in sorted(expected):
              source = download_root / relative
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          receipt = {
              "schema": "szl.constellation-hub-source/v1",
              "repo": repo_id,
              "sourceRevision": revision,
              "runtimeRevision": runtime.get("sha"),
              "runtimeStage": runtime.get("stage"),
              "hardware": hardware,
              "observedAt": dt.datetime.now(dt.timezone.utc)
                  .isoformat(timespec="seconds")
                  .replace("+00:00", "Z"),
              "files": receipt_files,
          }
          receipt_path = Path("docs/receipts/constellation-hub-source-244c2ae.json")
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          shutil.rmtree(download_root)
          print(
              json.dumps(
                  {
                      "state": "EXACT_HUB_SOURCE_IMPORTED",
                      "revision": revision,
                      "runtime": runtime.get("stage"),
                      "files": len(expected),
                  },
                  sort_keys=True,
              )
          )
          PY

          python -m py_compile \
            space/app.py \
            space/crosscheck.py \
            space/test_runtime_contract.py \
            space/tests/test_app.py
          git diff --check

      - name: Commit exact source import and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/constellation-source-reconcile-20260906
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm -- .github/workflows/_import_constellation_hub_source_once.yml
          git add -A -- space docs/receipts
          git diff --cached --check
          python - <<'PY'
          import subprocess

          changed = {
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
              if line
          }
          required = {
              ".github/workflows/_import_constellation_hub_source_once.yml",
              "docs/receipts/constellation-hub-source-244c2ae.json",
              "space/.gitattributes",
              "space/README.md",
              "space/app.py",
              "space/c2/index.html",
              "space/crosscheck.py",
              "space/estates.json",
              "space/holo/MIRROR.md",
              "space/holo/index.html",
              "space/requirements.txt",
              "space/test_runtime_contract.py",
              "space/tests/test_app.py",
              "space/verticals.json",
          }
          if changed != required:
              raise SystemExit(
                  f"source import escaped bounds: expected={sorted(required)} observed={sorted(changed)}"
              )
          PY
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit -s -m 'fix(source): reconcile exact Constellation Hub runtime'
          git push origin "HEAD:refs/heads/$branch"
