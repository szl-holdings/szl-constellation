# SPDX-License-Identifier: Apache-2.0
name: Publish source-bound Constellation Space

on:
  push:
    branches:
      - main
    paths:
      - space/**
      - tools/publish_constellation.py
      - tools/run_publish_constellation.py
      - tools/verify_constellation.py
      - tools/requirements-publish.txt
      - .github/workflows/constellation-ci.yml
      - .github/workflows/publish-constellation-space.yml
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: constellation-protected-main-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'szl-holdings/szl-constellation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checkout is current protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Set up declared Space Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install exact runtime, test, and publisher dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r space/requirements.txt
          -r space/requirements-test.txt
          -r tools/requirements-publish.txt

      - name: Re-prove source, dependency, and application contracts
        run: |
          python tools/verify_constellation.py
          python -m py_compile \
            space/app.py \
            space/crosscheck.py \
            space/test_runtime_contract.py \
            space/tests/test_app.py \
            tools/verify_constellation.py \
            tools/publish_constellation.py \
            tools/run_publish_constellation.py
          (
            cd space
            python -m pytest -q
          )
          python -m pip check
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Check out the immutable organization credential selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: bedcd3c77b5cf745dcc1490ac503e30397633227
          path: .shared-github
          fetch-depth: 1
          persist-credentials: false

      - name: Acquire and actively validate one Space publisher credential
        env:
          HF_ORG_TOKEN_CANDIDATE: ${{ secrets.HF_ORG_TOKEN }}
          HF_ORG_TOKEN1_CANDIDATE: ${{ secrets.HF_ORG_TOKEN1 }}
          HF_WRITE_TOKEN_CANDIDATE: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN_CANDIDATE: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN_CANDIDATE: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python .shared-github/.github/scripts/acquire_hf_publisher_token.py \
            --target-repo SZLHOLDINGS/szl-constellation \
            --target-type space \
            --oidc-resource spaces/SZLHOLDINGS/szl-constellation \
            --token-file "${RUNNER_TEMP}/constellation-hf-token" \
            --report artifacts/constellation-publisher-credential.json

      - name: Publish exact source and verify immutable/live readback
        shell: bash
        run: |
          set -euo pipefail
          token_file="${RUNNER_TEMP}/constellation-hf-token"
          test -s "$token_file"
          trap 'rm -f -- "$token_file"' EXIT
          HF_TOKEN="$(tr -d '\r\n' < "$token_file")" \
            python tools/run_publish_constellation.py

      - name: Remove the ephemeral publisher credential
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/constellation-hf-token"

      - name: Retain bounded deployment and credential-selection receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constellation-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/constellation-deployment-receipt.json
            artifacts/constellation-publisher-credential.json
          if-no-files-found: warn
          retention-days: 30
