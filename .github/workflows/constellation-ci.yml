# SPDX-License-Identifier: Apache-2.0
name: Constellation source and runtime contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: constellation-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up declared Space Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install exact runtime and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r space/requirements.txt -r space/requirements-test.txt

      - name: Verify exact pins, source inventory, and one-listener topology
        run: python tools/verify_constellation.py

      - name: Compile source and publisher
        run: |
          python -m py_compile \
            space/app.py \
            space/crosscheck.py \
            space/test_runtime_contract.py \
            space/tests/test_app.py \
            tools/verify_constellation.py \
            tools/publish_constellation.py

      - name: Run recovered application contracts
        working-directory: space
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest -q

      - name: Prove environment and tree are clean
        run: |
          python -m pip check
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test -z "$(git status --porcelain)"
