# SPDX-License-Identifier: Apache-2.0
name: Constellation source and runtime contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: constellation-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up declared Space Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install exact runtime and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          -r space/requirements.txt -r space/requirements-test.txt

      - name: Verify exact pins, source inventory, and one-listener topology
        run: python tools/verify_constellation.py

      - name: Compile source and publisher
        run: |
          python -m py_compile \
            space/app.py \
            space/crosscheck.py \
            space/test_runtime_contract.py \
            space/tests/test_app.py \
            tools/constellation_targets.py \
            tools/verify_constellation.py \
            tools/publish_constellation.py \
            tools/run_publish_constellation.py

      - name: Run recovered application contracts
        working-directory: space
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest -q

      - name: Run offline publisher target and lock contracts
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest -q -p no:cacheprovider tools/tests

      - name: Check synthetic controller state without network or a provider
        run: node --test space/tests/test_presentation_controller.cjs

      - name: Install isolated rendered-qualification tools
        run: |
          python -m venv "$RUNNER_TEMP/constellation-browser"
          "$RUNNER_TEMP/constellation-browser/bin/python" -m pip install --disable-pip-version-check --no-cache-dir playwright==1.60.0
          "$RUNNER_TEMP/constellation-browser/bin/python" -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/constellation-three" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund three@0.160.0

      - name: Render four actual fronts with local unavailable and synthetic fixtures
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          GRADIO_ANALYTICS_ENABLED: "False"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          "$RUNNER_TEMP/constellation-browser/bin/python" tools/verify_constellation_browser.py \
            --runtime-python "$(command -v python)" \
            --three-root "$RUNNER_TEMP/constellation-three/node_modules/three" \
            --out "$RUNNER_TEMP/constellation-native-observations"

      - name: Retain unsigned rendered observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: constellation-native-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/constellation-native-observations
          if-no-files-found: warn

      - name: Prove environment and tree are clean
        run: |
          python -m pip check
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test -z "$(git status --porcelain)"
