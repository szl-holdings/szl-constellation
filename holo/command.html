<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SZL Constellation</title>
<style>
:root{--bg:#0c0d0b;--fg:#e8e6df;--muted:#9a9a90;--line:#2a2c27;--accent:#b8c4b0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
a{color:var(--accent)}header,main{max-width:1200px;margin:0 auto;padding:1rem 1.25rem}
h1{font-weight:500;letter-spacing:-.03em;margin:0}
.sub{color:var(--muted);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;margin:.35rem 0 1rem}
canvas{display:block;width:100%;height:360px;border:1px solid var(--line);background:#0c0d0b}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.chip{border:1px solid var(--line);min-height:2.75rem;padding:.5rem .75rem;display:inline-flex;align-items:center;font-size:.8rem}
.grid{display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{border:1px solid var(--line);padding:.7rem;color:inherit;text-decoration:none;min-height:2.75rem}
.card small{display:block;color:var(--muted);margin-top:.3rem}
</style>
</head>
<body>
<header>
<p class="sub">SZLHOLDINGS / szl-constellation</p>
<h1>Constellation</h1>
<p class="sub">Second brain · Anatomy · 49 estates</p>
<p>Runtime on <a href="https://a-11-oy.com/command">a-11-oy.com/command</a>. Proof on <a href="https://a11oy.net">a11oy.net</a>. This file is the hologram source. Catalog DECLARED. Lambda is Conjecture 1.</p>
</header>
<main>
<canvas id="brain" width="1200" height="360" aria-label="Second brain map"></canvas>
<div class="row">
<a class="chip" href="https://a-11-oy.com/command">Command Center</a>
<a class="chip" href="https://a-11-oy.com/command/anatomy">Anatomy</a>
<a class="chip" href="https://a-11-oy.com/command/constellation">Constellation tab</a>
<a class="chip" href="https://huggingface.co/spaces/SZLHOLDINGS/yarqa">YARQA</a>
</div>
<div class="grid" id="grid"></div>
</main>
<script>
const ESTATES=["a11oy-factory","second-brain","anatomy","holographic","szl-command-lab","szl-sovereign-os","hatun-mcp","sda","governed-agent-bench","guardrail-receipt","frontier-bench","puriq-markets","quant-curve","szl-quant-live","terra-assurance","szl-real-estate","szl-estate-live","lyte-lattice","lyte-services","nexus","cosmos","immune","immune-lattice","ayllu","counsel-assurance","evidence-studio","prove-it","yarqa","szl-khipu","khipu-lab","szl-kernels-live","szl-atelier","szl-forge-lab","szl-model-inference-lab","szl-experiments","experiments","energy-attest-holo","energy-attested-runs","receipt-chain-live","lambda-gate-holo","governed-norm-holo","llm-router-live","szl-blocked-live","szl-govsign-live","szl-provctl-live","szl-frontier","gdw-frontier","retrieval-bench","governed-receipt-verifier"];
const g=document.getElementById("grid");
ESTATES.forEach(function(id){
  const a=document.createElement("a");
  a.className="card";
  a.href="https://a-11-oy.com/command/constellation";
  a.innerHTML="<strong>"+id+"</strong><small>opens command tab</small>";
  g.appendChild(a);
});
const c=document.getElementById("brain");
const x=c.getContext("2d");
let t=0;
function draw(){
  t+=0.008;
  const w=c.width,h=c.height;
  x.fillStyle="#0c0d0b";x.fillRect(0,0,w,h);
  const b={x:w*0.38,y:h*0.48}, a={x:w*0.62,y:h*0.52};
  x.strokeStyle="rgba(184,196,176,0.25)";
  x.beginPath();x.ellipse(b.x,b.y,40,28,0,0,Math.PI*2);x.stroke();
  x.strokeStyle="rgba(168,180,188,0.3)";
  x.beginPath();x.ellipse(a.x,a.y,36,26,0,0,Math.PI*2);x.stroke();
  x.fillStyle="#b8c4b0";x.beginPath();x.arc(b.x,b.y,7,0,Math.PI*2);x.fill();
  x.fillStyle="#a8b4bc";x.beginPath();x.arc(a.x,a.y,6,0,Math.PI*2);x.fill();
  ESTATES.forEach(function(id,i){
    const core=id==="anatomy"||id==="a11oy-factory"?a:b;
    const R=70+(i%5)*22;
    const ang=i*2.39996+t*(0.2+i%5*0.02);
    const px=core.x+Math.cos(ang)*R;
    const py=core.y+Math.sin(ang)*R*0.62;
    x.strokeStyle="rgba(184,196,176,0.12)";
    x.beginPath();x.moveTo(core.x,core.y);x.lineTo(px,py);x.stroke();
    x.fillStyle="rgba(232,230,223,0.7)";
    x.beginPath();x.arc(px,py,2.2,0,Math.PI*2);x.fill();
  });
  x.fillStyle="#b8c4b0";x.font="12px sans-serif";
  x.fillText("Second brain",b.x-36,b.y-40);
  x.fillStyle="#a8b4bc";x.fillText("Anatomy",a.x-24,a.y+48);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
