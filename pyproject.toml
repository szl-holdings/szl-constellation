[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-constellation"
version = "0.1.0"
description = "SZL Constellation - the living archive. 49 estates unarchived as a WebGL hologram, 8 verticals wired to their real repos/kernels/models/datasets, FastAPI JSON backend with recomputing receipts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = []

[project.urls]
Homepage = "https://huggingface.co/spaces/SZLHOLDINGS/szl-constellation"
Repository = "https://github.com/szl-holdings/szl-constellation"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
